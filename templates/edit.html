<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container narrow">
    <header>
        <div>
            <p class="eyebrow">EXPENSE #{{ expense.id }}</p>
            <h1>Edit Expense</h1>
            <p class="subtitle">Update the details of your expense.</p>
        </div>
        <a class="button secondary" href="{{ url_for('index') }}">Back</a>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <section class="panel">
        <form action="{{ url_for('edit_expense', expense_id=expense.id) }}" method="POST">
            <label>Expense Title</label>
            <input type="text" name="title" value="{{ expense.title }}" required>

            <label>Amount</label>
            <input type="number" name="amount" value="{{ expense.amount }}" step="0.01" min="0" required>

            <label>Category</label>
            <input type="text" name="category" value="{{ expense.category }}" required>

            <label>Date</label>
            <input type="text" name="date" value="{{ expense.date }}" placeholder="DD-MM-YYYY" required>

            <button class="button" type="submit">Save Changes</button>
        </form>
    </section>
</div>
</body>
</html>
